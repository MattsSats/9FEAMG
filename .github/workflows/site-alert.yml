# Emails the repo owner when the Yahoo sync or the live-score function is failing (scripts/watch.mjs).
# A failed run is the alert: GitHub sends the email. Run it by hand with "test" ticked to try the email.
name: "9FEAMG alert: Yahoo sync or live scores failing"
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Fail on purpose, to try the email"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/watch.mjs ${{ inputs.test && '--test' || '' }}
